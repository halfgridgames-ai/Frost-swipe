<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;src:url(../art/fredoka.woff2) format("woff2");font-weight:300 700}
html,body{margin:0;overflow:hidden}
#s{position:relative;background:linear-gradient(180deg,#2a4f8c,#0f1f3a 70%);display:flex;flex-direction:column;align-items:center;font-family:Fredoka,sans-serif;color:#fff;overflow:hidden}
h1{margin:0;font-weight:700;text-align:center;text-shadow:0 6px 16px rgba(0,0,0,.35)}
p{margin:0;font-weight:600;color:#8fd8ff;text-align:center}
.ph{border-radius:9%/4.2%;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5);background:#000}
.ph img{display:block;width:100%;height:100%}
.flake{position:absolute;border-radius:50%;background:#fff}
</style></head><body><div id="s"></div><script>
window.setShot = (img, title, sub, W, H) => {
  const s = document.getElementById('s'); s.style.width = W + 'px'; s.style.height = H + 'px';
  const u = W / 100;
  let seed = 3; const r = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) { const f = document.createElement('div'); f.className = 'flake'; const z = (r() * 0.8 + 0.3) * u; Object.assign(f.style, { width: z + 'px', height: z + 'px', left: r() * W + 'px', top: r() * H * 0.3 + 'px', opacity: 0.3 + r() * 0.6 }); s.appendChild(f); }
  const t = document.createElement('h1'); t.textContent = title; t.style.fontSize = 8.4 * u + 'px'; t.style.marginTop = (H / W > 2 ? 16 : 7) * u + 'px';
  const p = document.createElement('p'); p.textContent = sub; p.style.fontSize = 4.4 * u + 'px'; p.style.marginTop = 1.6 * u + 'px';
  const ph = document.createElement('div'); ph.className = 'ph'; const top = H / W > 2 ? 40 : 27; const ah = H - top * u - 4 * u; const aw = ah * (H / W > 2 ? 430 / 932 : 390 / 844);
  Object.assign(ph.style, { width: aw + 'px', height: ah + 'px', marginTop: (H / W > 2 ? 6 : 3.5) * u + 'px', border: 1.4 * u + 'px solid #f4f9ff' });
  const im = new Image(); im.src = 'data:image/png;base64,' + img; ph.appendChild(im);
  s.append(t, p, ph);
  document.fonts.load('700 40px Fredoka').then(() => im.decode()).then(() => { window.ready = true; });
};
</script></body></html>
